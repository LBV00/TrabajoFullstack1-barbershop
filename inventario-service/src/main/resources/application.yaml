server:
  port: 7098

spring:
  application:
    name: inventario-service

  datasource:
    url: jdbc:mysql://localhost:3306/db_barbershop_inventario?createDatabaseIfNotExist=true
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.sql
    
  springdoc:
    swagger-ui:
    path: /swagger-ui.html