server:
  port: 7092

spring:
  application:
    name: reserva-service
  datasource:
    url: jdbc:mysql://localhost:3306/db_barbershop_reservas?createDatabaseIfNotExist=true
    username: root
    password: 
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.sql

# Rutas para consultar por WebClient
api:
  base-url: http://localhost:7090
  user: /users/%s/exists
  producto: /productos/%s/exists