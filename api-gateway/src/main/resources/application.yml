server:
  port: 7090

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        # ==============================================
        # RUTAS DE API-DOCS (deben ir ANTES que las rutas generales)
        # ==============================================

        # --- USER DOCS ---
        - id: user-docs
          uri: http://localhost:7091
          predicates:
            - Path=/users/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # --- RESERVA DOCS ---
        - id: reserva-docs
          uri: http://localhost:7092
          predicates:
            - Path=/reservas/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # --- PRODUCTO DOCS ---
        - id: producto-docs
          uri: http://localhost:7093
          predicates:
            - Path=/productos/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # --- PAGO DOCS ---
        - id: pago-docs
          uri: http://localhost:7094
          predicates:
            - Path=/pagos/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # --- RESENA DOCS ---
        - id: resena-docs
          uri: http://localhost:7095
          predicates:
            - Path=/resenas/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # --- AUTH DOCS ---
        - id: auth-docs
          uri: http://localhost:7096
          predicates:
            - Path=/auth/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # --- EMPLEADO DOCS ---
        - id: empleado-docs
          uri: http://localhost:7097
          predicates:
            - Path=/empleados/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # --- INVENTARIO DOCS ---
        - id: inventario-docs
          uri: http://localhost:7098
          predicates:
            - Path=/inventarios/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # --- NOTIFICACION DOCS ---
        - id: notificacion-docs
          uri: http://localhost:7099
          predicates:
            - Path=/notificaciones/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # --- SERVICIO DOCS ---
        - id: servicio-docs
          uri: http://localhost:7100
          predicates:
            - Path=/servicios/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # --- SUCURSAL DOCS ---
        - id: sucursal-docs
          uri: http://localhost:7101
          predicates:
            - Path=/sucursales/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        # ==============================================
        # RUTAS GENERALES (deben ir DESPUÉS de los docs)
        # ==============================================

        # --- USER SERVICE ---
        - id: user-service
          uri: http://localhost:7091
          predicates:
            - Path=/users/**

        # --- RESERVA SERVICE ---
        - id: reserva-service
          uri: http://localhost:7092
          predicates:
            - Path=/reservas/**

        # --- PRODUCTO SERVICE ---
        - id: producto-service
          uri: http://localhost:7093
          predicates:
            - Path=/productos/**

        # --- PAGO SERVICE ---
        - id: pago-service
          uri: http://localhost:7094
          predicates:
            - Path=/pagos/**

        # --- RESENA SERVICE ---
        - id: resena-service
          uri: http://localhost:7095
          predicates:
            - Path=/resenas/**

        # --- AUTH SERVICE ---
        - id: auth-service
          uri: http://localhost:7096
          predicates:
            - Path=/auth/**

        # --- EMPLEADO SERVICE ---
        - id: empleado-service
          uri: http://localhost:7097
          predicates:
            - Path=/empleados/**

        # --- INVENTARIO SERVICE ---
        - id: inventario-service
          uri: http://localhost:7098
          predicates:
            - Path=/inventarios/**

        # --- NOTIFICACION SERVICE ---
        - id: notificacion-service
          uri: http://localhost:7099
          predicates:
            - Path=/notificaciones/**

        # --- SERVICIO SERVICE ---
        - id: servicio-service
          uri: http://localhost:7100
          predicates:
            - Path=/servicios/**

        # --- SUCURSAL SERVICE ---
        - id: sucursal-service
          uri: http://localhost:7101
          predicates:
            - Path=/sucursales/**

jwt:
  secret: barbershop-secret-key-2025-fullstack-duoc-uc-muy-segura

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    disable-swagger-default-url: true
    urls:
      - name: Auth Service
        url: /auth/v3/api-docs
      - name: User Service
        url: /users/v3/api-docs
      - name: Reserva Service
        url: /reservas/v3/api-docs
      - name: Producto Service
        url: /productos/v3/api-docs
      - name: Pago Service
        url: /pagos/v3/api-docs
      - name: Resena Service
        url: /resenas/v3/api-docs
      - name: Empleado Service
        url: /empleados/v3/api-docs
      - name: Inventario Service
        url: /inventarios/v3/api-docs
      - name: Notificacion Service
        url: /notificaciones/v3/api-docs
      - name: Servicio Service
        url: /servicios/v3/api-docs
      - name: Sucursal Service
        url: /sucursales/v3/api-docs