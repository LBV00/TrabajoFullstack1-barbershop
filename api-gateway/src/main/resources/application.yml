server:
  port: 9090

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:9091
              predicates:
                - Path=/api/v1/users/**

            - id: reserva-service
              uri: http://localhost:9092
              predicates:
                - Path=/api/v1/reservas/**
            
            - id: producto-service
              uri: http://localhost:9093
              predicates:
                - Path=/api/v1/productos/**
                
            - id: pago-service
              uri: http://localhost:9094
              predicates:
                - Path=/api/v1/pagos/**

            - id: resena-service
              uri: http://localhost:9095
              predicates:
                - Path=/api/v1/resenas/**