server:
  port: 7100

spring:
  application:
    name: servicio-service

  datasource:
    url: jdbc:mysql://localhost:3306/db_barbershop_servicios?createDatabaseIfNotExist=true
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.sql
    
  pringdoc:
    swagger-ui:
    path: /swagger-ui.html