server:
  port: 7094

spring:
  application:
    name: pago-service
  datasource:
    url: jdbc:mysql://localhost:3306/db_barbershop_pagos?createDatabaseIfNotExist=true
    username: root
    password: 
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.sql
  springdoc:
    swagger-ui:
    path: /swagger-ui.html
