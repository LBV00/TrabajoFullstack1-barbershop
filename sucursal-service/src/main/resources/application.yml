server:
  port: 7101

spring:
  application:
    name: sucursal-service

  datasource:
    url: jdbc:mysql://localhost:3306/db_barbershop_sucursal?createDatabaseIfNotExist=true
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.sql

  springdoc:
    swagger-ui:
    path: /swagger-ui.html